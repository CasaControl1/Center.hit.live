<!doctype html><html lang='de'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Center Hit Live</title><style>body{background:#101827;color:white;font:16px system-ui;max-width:680px;margin:auto;padding:18px}button{padding:14px;border:0;border-radius:9px;background:#377af6;color:white}video{width:100%}#signal{font-size:30px;font-weight:bold;text-align:center;padding:24px;background:#374151;border-radius:12px}label{display:block;margin:16px 0}</style><h1>🎯 Center Hit Live</h1><p>Richte die iPhone-Kamera auf den Spielbalken am iPad. Experimentelle Erkennung – vor dem letzten Versuch testen.</p><video id='video' autoplay muted playsinline></video><canvas id='c' hidden></canvas><div id='signal'>KAMERA STARTEN</div><p><button id='start'>Kamera starten</button> <button id='stop'>Stoppen</button></p><label>Reaktionsvorlauf: <output id='out'>150</output> ms <input id='ms' type='range' min='0' max='350' value='150'></label><label>Zielmitte: <input id='target' type='range' min='10' max='90' value='50'></label><label>Höhe des Spielbalkens: <input id='row' type='range' min='10' max='90' value='50'></label><p id='info'>Noch keine Messung</p><small>Nur visuelles Signal, kein automatischer Tipp. Kamera-Verarbeitung lokal.</small><script>const $=x=>document.getElementById(x),v=$('video'),c=$('c'),ctx=c.getContext('2d',{willReadFrequently:true});let stream,raf,prev=null,last=0,vel=0;$('ms').oninput=()=>$('out').textContent=$('ms').value;$('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});v.srcObject=stream;await v.play();prev=null;last=0;loop()}catch(e){$('info').textContent=e.message}};$('stop').onclick=()=>{cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());stream=null;$('signal').textContent='GESTOPPT'};function loop(t){if(!stream)return;raf=requestAnimationFrame(loop);if(!v.videoWidth)return;c.width=320;c.height=Math.round(320*v.videoHeight/v.videoWidth);ctx.drawImage(v,0,0,c.width,c.height);let y=Math.round(c.height*Number($('row').value)/100),d=ctx.getImageData(0,Math.max(0,y-2),320,5).data,groups=[],g=[];for(let x=0;x<320;x++){let count=0;for(let j=0;j<5;j++){let i=(j*320+x)*4;if(d[i]>195&&d[i+1]>195&&d[i+2]>195)count++}if(count>=3){if(g.length&&x-g[g.length-1]>2){groups.push(g);g=[]}g.push(x)}}if(g.length)groups.push(g);let center=Number($('target').value)*3.2,candidate=groups.filter(a=>a.length>=2&&a.length<35).sort((a,b)=>Math.abs((a[0]+a[a.length-1])/2-center)-Math.abs((b[0]+b[b.length-1])/2-center))[0];if(!candidate){$('signal').textContent='🔴 SUCHE STAB';return}let x=(candidate[0]+candidate[candidate.length-1])/2;if(prev!==null&&t-last>0&&t-last<180)vel=vel*.6+((x-prev)/(t-last))*.4;prev=x;last=t;let pred=x+vel*Number($('ms').value),approaching=(center-x)*vel>0,err=Math.abs(pred-center);$('signal').textContent=approaching&&err<9?'🟢 JETZT TIPPEN':approaching&&err<28?'🟡 BEREIT':'🔴 WARTEN';$('info').textContent='Position '+x.toFixed(0)+' · Ziel '+center.toFixed(0)+' · Geschwindigkeit '+(vel*1000).toFixed(0)+' px/s'}</script></html>
